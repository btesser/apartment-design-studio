name: Deploy viewers to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - name: Download viewer models from Git LFS
        run: git lfs pull --include="apartment-walkthrough/assets/**,his-office-redesign/viewer-source/assets/**,his-office-pinterest/viewer-source/assets/**" --exclude=""
      - name: Check Pages packaging
        run: python3 scripts/test-pages.py
      - name: Build static site
        run: python3 scripts/build-pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
